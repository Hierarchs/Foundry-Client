name: Verify and build Rust Windows client
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:rust
      - run: node scripts/rust.cjs fmt --manifest-path native/Cargo.toml -- --check
      - run: node scripts/rust.cjs clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
      - uses: actions/upload-artifact@v4
        with:
          name: Foundry-Client-Rust-Windows
          path: release/rust/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: test-results/
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Foundry-Client-Rust-Windows
          path: release/rust
      - name: Publish complete Windows release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $clientVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $releaseTag = $env:GITHUB_REF_NAME
          if ($releaseTag -ne "v$clientVersion") { throw 'Release tag must match the client version.' }
          $releaseFiles = @(
            "release/rust/Foundry-Client-Rust-$clientVersion-x64.exe",
            "release/rust/Foundry-Client-Rust-Setup-$clientVersion-x64.exe",
            "release/rust/Foundry-Client-Rust-$clientVersion-x64.zip",
            'release/rust/SHA256SUMS.txt',
            'release/rust/THIRD_PARTY_NOTICES.txt'
          )
          foreach ($releaseFile in $releaseFiles) {
            if (-not (Test-Path -LiteralPath $releaseFile)) { throw "Missing release artifact: $releaseFile" }
          }
          gh release create $releaseTag @releaseFiles --verify-tag --draft --title "Foundry Client $clientVersion" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $releaseTag --draft=false --latest
          exit $LASTEXITCODE
