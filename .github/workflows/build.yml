name: Verify and build Rust Windows client
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', '.cargo/config.toml') }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:rust
      - run: node scripts/rust.cjs fmt --manifest-path native/Cargo.toml -- --check
      - run: node scripts/rust.cjs clippy --manifest-path native/Cargo.toml --all-targets --locked -- -D warnings
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''
      - uses: actions/upload-artifact@v4
        with:
          name: Foundry-Client-Rust-Windows
          path: release/rust/*
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: test-results/
